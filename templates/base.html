<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Summit Doodles{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/logo-icon.png') }}">
</head>
<body>
{% block body %}{% endblock %}

<div id="lightbox-overlay" class="lightbox-overlay" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="">
  <button type="button" class="lightbox-close" onclick="closeLightbox(event)" aria-label="Close">&times;</button>
</div>
<script>
  // Click-to-enlarge for dog/puppy photos: any <img class="zoomable"> opens
  // full-size in this one shared lightbox (event delegation, so no
  // per-image wiring needed).
  document.addEventListener('click', function (e) {
    var img = e.target.closest('img.zoomable');
    if (!img) return;
    e.preventDefault();
    e.stopPropagation();
    document.getElementById('lightbox-img').src = img.src;
    document.getElementById('lightbox-overlay').classList.add('open');
  });
  function closeLightbox(e) {
    if (e && e.target && e.target.id === 'lightbox-img') return;
    document.getElementById('lightbox-overlay').classList.remove('open');
    document.getElementById('lightbox-img').src = '';
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeLightbox();
  });
</script>
</body>
</html>
