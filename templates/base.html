<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Summit Doodles{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/logo-icon.png') }}">

  <!-- Installable "app-like" experience on mobile (Add to Home Screen /
       Install app) -- no App Store or Play Store listing involved. -->
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#0054AA">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icons/apple-touch-icon.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Summit Doodles">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
{% block body %}{% endblock %}

<div id="lightbox-overlay" class="lightbox-overlay" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="">
  <button type="button" class="lightbox-close" onclick="closeLightbox(event)" aria-label="Close">&times;</button>
</div>
<script>
  // Click-to-enlarge for dog/puppy photos: any <img class="zoomable"> opens
  // full-size in this one shared lightbox (event delegation, so no
  // per-image wiring needed).
  document.addEventListener('click', function (e) {
    var img = e.target.closest('img.zoomable');
    if (!img) return;
    e.preventDefault();
    e.stopPropagation();
    document.getElementById('lightbox-img').src = img.src;
    document.getElementById('lightbox-overlay').classList.add('open');
  });
  function closeLightbox(e) {
    if (e && e.target && e.target.id === 'lightbox-img') return;
    document.getElementById('lightbox-overlay').classList.remove('open');
    document.getElementById('lightbox-img').src = '';
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeLightbox();
  });

  // Collapsible sidebar nav groups (public sidebar): clicking a group's
  // toggle button expands/collapses its sub-links. Server already renders
  // the group open when the current page is inside it, so this only
  // handles manual expand/collapse from here on. Desktop: independent
  // toggles, any number of groups can stay open.
  //
  // On the mobile horizontal nav bar, sub-links float as a dropdown rather
  // than pushing the bar taller (see CSS) -- so there, start every group
  // closed on load (an auto-open dropdown on page load looks broken),
  // only one dropdown open at a time, and tapping outside closes it.
  var MOBILE_NAV_WIDTH = 880;
  var isMobileNav = window.innerWidth <= MOBILE_NAV_WIDTH;
  if (isMobileNav) {
    document.querySelectorAll('.navgroup.open').forEach(function (g) {
      g.classList.remove('open');
    });
  }
  // The dropdown is position:fixed (see CSS comment for why), so its
  // top/left have to be set in JS from the toggle button's own location.
  function positionMobileDropdown(group, btn) {
    var sub = group.querySelector('.navsub');
    if (!sub) return;
    var rect = btn.getBoundingClientRect();
    sub.style.top = (rect.bottom + 8) + 'px';
    var left = Math.max(8, Math.min(rect.left, window.innerWidth - sub.offsetWidth - 8));
    sub.style.left = left + 'px';
  }
  function closeAllMobileGroups() {
    document.querySelectorAll('.navgroup.open').forEach(function (g) {
      g.classList.remove('open');
    });
  }
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('.nav-toggle-btn, .nav-chevron-btn');
    if (btn) {
      e.preventDefault();
      var group = btn.closest('.navgroup');
      if (!group) return;
      var wasOpen = group.classList.contains('open');
      if (isMobileNav) {
        document.querySelectorAll('.navgroup.open').forEach(function (g) {
          if (g !== group) g.classList.remove('open');
        });
      }
      group.classList.toggle('open', !wasOpen);
      if (isMobileNav && !wasOpen) positionMobileDropdown(group, btn);
      return;
    }
    if (isMobileNav && !e.target.closest('.navgroup')) {
      closeAllMobileGroups();
    }
  });
  if (isMobileNav) {
    // A fixed-position dropdown doesn't track the button if the page
    // scrolls out from under it -- just close it instead of drifting.
    window.addEventListener('scroll', closeAllMobileGroups, { passive: true });
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
